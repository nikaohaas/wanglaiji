    .search-panel{display:flex;gap:8px;padding:7px 16px 5px}.search-box{min-width:0;flex:1;height:46px;display:flex;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:15px;padding:0 13px}.search-box span{font-size:11px;color:var(--green);margin-right:9px;font-weight:600}.search-box input{min-width:0;flex:1;border:0;outline:0;background:transparent;font-size:13px;color:var(--ink)}.date-search-wrap{position:relative;width:72px;height:46px;display:grid;place-items:center;border:1px solid var(--line);border-radius:15px;background:var(--white);transition:.2s}.date-search-wrap.has{width:126px}.date-search-wrap span{font-size:12px;color:var(--ink);white-space:nowrap}.date-search-wrap input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.search-action{height:46px;padding:0 13px;border-radius:15px;background:var(--green);color:white;font-size:12px}.clear-search{display:block;margin:2px 20px 4px auto;background:transparent;color:var(--orange);font-size:12px}

nthly-trend-title{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}.trend-row{display:grid;grid-template-columns:29px 1fr 84px;align-items:center;gap:7px;min-height:22px;font-size:10px;color:var(--muted)}.trend-track{height:6px;border-radius:6px;background:#dce5d9;overflow:hidden}.trend-fill{display:block;height:100%;border-radius:6px;background:var(--green);min-width:0}.trend-row strong{text-align:right;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}.trend-row.selected strong,.trend-row.selected>span:first-child{color:var(--green)}.profit-line{display:flex;align-items:center;gap:8px;padding:10px 3px 0;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}.profit-line b{font-size:15px;color:var(--green);margin-left:auto}.profit-line.loss b{color:#bd5938}.profit-line .unknown{color:var(--orange)}

    .bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;height:77px;background:rgba(255,254,250,.94);backdrop-filter:blur(16px);border-top:1px solid rgba(204,204,195,.8);display:flex;justify-content:space-around;padding-top:9px;padding-bottom:env(safe-area-inset-bottom)}.nav{width:72px;color:#89918d;background:transparent;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}.nav.on{color:var(--green);font-weight:600}.fab{position:fixed;z-index:22;right:19px;bottom:94px;width:58px;height:58px;border-radius:19px;background:var(--orange);color:white;font-size:29px;box-shadow:0 10px 22px rgba(204,83,37,.3)}
    .page-head{padding:20px 18px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:rgba(246,243,235,.94);backdrop-filter:blur(12px)}.back{width:40px;height:40px;border-radius:50%;background:var(--white);color:var(--ink);font-size:23px;border:1px solid var(--line)}.page-head h2{margin:0;font-size:21px}.form{padding:4px 17px 110px}.group{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:4px 16px;margin:12px 0}.field{padding:14px 0;border-bottom:1px solid #ebe9e0}.field:last-child{border:0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:8px}.field input,.field select{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px;padding:2px 0}.field input[type=date]{min-height:28px}.amount-wrap{display:flex;align-items:center;gap:7px}.amount-wrap span{font-size:18px}.yn-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #ebe9e0}.yn-row:last-child{border:0}.yn-title b{display:block;font-size:15px}.yn-title small{color:var(--muted);font-size:11px}.toggle{display:flex;background:#efeee8;padding:3px;border-radius:10px}.toggle button{width:47px;padding:7px 0;background:transparent;color:#929994;border-radius:8px;font-size:12px}.toggle .yes.on{background:var(--green);color:white}.toggle .no.on{background:#fff;color:var(--ink);box-shadow:0 2px 7px rgba(0,0,0,.08)}.save{position:fixed;z-index:15;bottom:18px;left:18px;right:18px;height:54px;background:var(--green);color:white;border-radius:17px;font-weight:600;font-size:16px;box-shadow:0 10px 22px rgba(29,98,82,.22)}.delete{width:100%;height:48px;border-radius:15px;background:#f8e4dc;color:#a9431f;margin-top:15px}.hint{font-size:12px;color:var(--muted);padding:2px 5px;line-height:1.6}
    .status-item{border-bottom:1px solid #ebe9e0}.status-item:last-child{border-bottom:0}.status-item .yn-row{border-bottom:0}.completion-date{display:none;align-items:center;justify-content:space-between;margin:-3px 0 13px;padding:10px 12px;background:var(--green2);border-radius:12px}.completion-date.show{display:flex}.completion-date label{font-size:12px;color:var(--green);font-weight:600}.completion-date input{border:0;outline:0;background:transparent;color:var(--ink);font-size:13px;text-align:right}
    .entity-add{margin:8px 16px 16px;display:flex;gap:9px}.entity-add input{min-width:0;flex:1;border:1px solid var(--line);border-radius:15px;background:var(--white);padding:14px;outline:0}.entity-add button{width:56px;border-radius:15px;background:var(--green);color:white;font-size:24px}.entity-list{padding:0 16px}.entity{display:flex;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:16px;margin:9px 0;padding:14px}.entity-icon{width:38px;height:38px;border-radius:12px;background:var(--green2);color:var(--green);display:grid;place-items:center;margin-right:12px}.entity span{flex:1;font-size:15px}.entity button{background:transparent;color:#b3b7b5;font-size:19px;padding:8px}.toast{position:fixed;z-index:99;left:50%;bottom:105px;transform:translate(-50%,20px);background:#18352f;color:#fff;padding:11px 17px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    .delete-dialog[hidden]{display:none}.delete-dialog{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:20px;background:rgba(16,35,30,.58);backdrop-filter:blur(4px)}.delete-sheet{width:min(100%,390px);background:var(--white);border-radius:24px;padding:24px 22px 20px;box-shadow:0 24px 65px rgba(10,27,22,.25);animation:rise .2s both}.delete-symbol{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#f8e4dc;color:#a9431f;font-size:24px;margin-bottom:15px}.delete-sheet h2{font-size:20px;margin:0 0 8px}.delete-sheet p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 17px}.delete-sheet p strong{color:#a9431f}.delete-sheet label{display:block;font-size:12px;color:var(--ink);margin-bottom:8px}.delete-sheet input{width:100%;height:46px;border:1px solid #d5d6ca;border-radius:12px;background:#fbfaf5;padding:0 13px;outline:none;color:var(--ink);font-size:16px}.delete-sheet input:focus{border-color:#b96144;box-shadow:0 0 0 3px #fae5d9}.delete-actions{display:flex;gap:9px;margin-top:18px}.delete-actions button{flex:1;height:46px;border-radius:12px;font-size:14px;font-weight:600}.delete-cancel{background:#ecece5;color:var(--ink)}.delete-confirm{background:#b85637;color:white}.delete-confirm:disabled{background:#dbc9c0;color:#fbf8f5}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.card,.summary,.empty{animation:rise .36s both}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}

<body><main id="app" class="app"></main><div id="toast" class="toast"></div><div id="deleteDialog" class="delete-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="deleteTitle"><form class="delete-sheet" onsubmit="deleteConfirmed(event)"><div class="delete-symbol">!</div><h2 id="deleteTitle">删除这笔账目？</h2><p>删除后无法恢复。请在下方输入 <strong>确认</strong>，再点击删除。</p><label for="deletePhrase">输入“确认”</label><input id="deletePhrase" autocomplete="off" maxlength="2" oninput="updateDeleteButton()"><div class="delete-actions"><button class="delete-cancel" type="button" onclick="closeDeleteDialog()">取消</button><button id="deleteConfirmButton" class="delete-confirm" type="submit" disabled>删除账目</button></div></form></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=JSON.parse(localStorage.getItem('wl-ledger')||'{"records":[],"clients":[],"suppliers":[]}');
let page='home', filter='all', editId=null, deleteTargetId=null, searchText='', searchDate='', dashboardYear=new Date().getFullYear(), dashboardMonth=new Date().getMonth()+1; const saveDB=()=>localStorage.setItem('wl-ledger',JSON.stringify(db));
const icons={book:'<svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M8 7h8M8 11h6"/></svg>',people:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.4 2.4-6 6-6s6 2.6 6 6M16 5.5a3 3 0 0 1 0 5.5M17 13c2.6.4 4 2.6 4 5"/></svg>',truck:'<svg viewBox="0 0 24 24"><path d="M3 6h11v11H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>'};
function nav(active){return `<nav class="bottom"><button class="nav ${active==='home'?'on':''}" onclick="go('home')">${icons.book}<span>账目</span></button><button class="nav ${active==='clients'?'on':''}" onclick="go('clients')">${icons.people}<span>客户</span></button><button class="nav ${active==='suppliers'?'on':''}" onclick="go('suppliers')">${icons.truck}<span>供货商</span></button></nav>`}
function go(p){page=p;editId=null;render();scrollTo(0,0)}
function localDate(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function money(v){return v?`¥ ${esc(v)}`:'未填写'}
function cents(v){if(v===''||v===null||v===undefined)return null;let n=Number(v);return Number.isFinite(n)?Math.round(n*100):null}
function yuan(c){return `¥ ${new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(c/100)}`}
function profitCents(r){let sale=cents(r.saleAmount),buy=cents(r.supplyAmount);if(sale===null||buy===null)return null;return sale-buy-(cents(r.taxAmount)||0)-(cents(r.otherExpense)||0)}
function dashboard(){let months=Array.from({length:12},(_,i)=>({month:i+1,sales:0,profit:0,salesMissing:0,profitMissing:0}));for(let r of db.records){if(!r.date||!r.date.startsWith(String(dashboardYear)+'-'))continue;let m=Number(r.date.slice(5,7));if(m<1||m>12)continue;let x=months[m-1],s=cents(r.saleAmount),p=profitCents(r);if(s===null)x.salesMissing++;else x.sales+=s;if(p===null)x.profitMissing++;else x.profit+=p}let annual={sales:months.reduce((s,x)=>s+x.sales,0),profit:months.reduce((s,x)=>s+x.profit,0),salesMissing:months.reduce((s,x)=>s+x.salesMissing,0),profitMissing:months.reduce((s,x)=>s+x.profitMissing,0)},current=months[dashboardMonth-1],max=Math.max(1,...months.map(x=>x.sales));let stat=(label,value,missing,kind='')=>`<div class="dash-stat ${kind} ${value<0?'loss':''}"><small>${label}</small><b>${yuan(value)}</b>${missing?`<em>${missing} 笔金额待补</em>`:''}</div>`;return `<section class="dashboard"><div class="dashboard-head"><div><div class="dashboard-kicker">经营一览 / OVERVIEW</div><h2>销售与盈亏</h2></div><div class="year-control"><button aria-label="上一年" onclick="changeYear(-1)">‹</button><strong>${dashboardYear}</strong><button aria-label="下一年" onclick="changeYear(1)">›</button></div></div><p class="dash-note">按需求日期归属月份；利润 = 销售金额 − 进货金额 − 税费 − 其他支出</p><div class="dash-grid">${stat('全年销售额',annual.sales,annual.salesMissing)}${stat('全年盈亏',annual.profit,annual.profitMissing,'profit')}</div><div class="month-head"><b>${dashboardMonth} 月经营</b><span>点击月份查看明细</span></div><div class="month-strip">${months.map(x=>`<button class="month-chip ${x.month===dashboardMonth?'on':''}" onclick="selectMonth(${x.month})">${x.month}月</button>`).join('')}</div><div class="month-details">${stat('本月销售额',current.sales,current.salesMissing)}${stat('本月盈亏',current.profit,current.profitMissing,'profit')}</div><div class="monthly-trend"><div class="monthly-trend-title"><span>月度销售情况</span><span>已填写的销售金额</span></div>${months.map(x=>`<div class="trend-row ${x.month===dashboardMonth?'selected':''}"><span>${x.month}月</span><div class="trend-track"><span class="trend-fill" style="width:${Math.max(0,x.sales)/max*100}%"></span></div><strong>${yuan(x.sales)}</strong></div>`).join('')}</div></section>`}
function changeYear(delta){dashboardYear+=delta;renderHome()}
function selectMonth(month){dashboardMonth=month;renderHome()}
function pending(r){return ['supplySettled','saleSettled','invoiced','paid','reimbursed'].filter(k=>!r[k]).length}
function renderHome(){let q=searchText.trim().toLowerCase();let rs=db.records.filter(r=>filter==='pending'?!r.reimbursed:filter==='done'?r.reimbursed:true).filter(r=>!q||[r.client,r.supplier,r.businessContent].some(v=>String(v||'').toLowerCase().includes(q))).filter(r=>!searchDate||r.date===searchDate);let wait=db.records.filter(r=>!r.reimbursed).length, active=db.records.filter(r=>!r.paid).length, searching=searchText||searchDate;$('#app').innerHTML=`<header class="top"><div class="brand"><small>${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})}</small><h1>往来记</h1></div><div class="avatar">账</div></header><section class="summary"><div class="summary-label">等待结算</div><div class="summary-num">${wait}<span>笔账目</span></div><div class="summary-row"><div><b>${active}</b>尚未回款</div><div><b>${db.records.length}</b>全部记录</div></div></section>${dashboard()}<div class="section-head"><h2>业务记录</h2><button onclick="setFilter('pending')">只看待办 →</button></div><form class="search-panel" onsubmit="applySearch(event)"><div class="search-box"><span>搜索</span><input id="searchText" value="${esc(searchText)}" placeholder="客户、供货商或业务内容"></div><label class="date-search-wrap ${searchDate?'has':''}"><span>${searchDate?esc(searchDate):'日期'}</span><input aria-label="按日期搜索" type="date" value="${esc(searchDate)}" onchange="setSearchDate(this.value)"></label><button class="search-action" type="submit">查找</button></form>${searching?`<button class="clear-search" onclick="clearSearch()">清除搜索</button>`:''}<div class="filters">${[['all','全部'],['pending','未结算'],['done','已完成']].map(x=>`<button class="filter ${filter===x[0]?'on':''}" onclick="setFilter('${x[0]}')">${x[1]}</button>`).join('')}</div><section class="records">${rs.length?rs.sort((a,b)=>b.date.localeCompare(a.date)).map(card).join(''):`<div class="empty"><div class="empty-mark">${searching?'⌕':'✓'}</div><h3>${searching?'没有找到匹配账目':filter==='all'?'还没有账目':'这里已经清清爽爽'}</h3><p>${searching?'换个关键词或日期试试':filter==='all'?'点右下角的加号，记下第一笔代采业务':'当前分类下没有需要处理的记录'}</p></div>`}</section><button class="fab" onclick="openForm()">＋</button>${nav('home')}`}
function card(r){let ks=[['supplySettled','供货结算'],['saleSettled','销售结算'],['invoiced','已开票'],['paid','已回款'],['reimbursed','已结算']],p=profitCents(r);return `<article class="card ${r.reimbursed?'done':''}" onclick="openForm('${r.id}')"><div class="card-top"><div><h3>${esc(r.client)}</h3><div class="meta">${esc(r.date)} · ${r.supplier?esc(r.supplier):'供货商待补充'}</div>${r.businessContent?`<div class="meta">${esc(r.businessContent)}</div>`:''}</div><span class="badge">${r.reimbursed?'流程完成':`待办 ${pending(r)} 项`}</span></div><div class="money"><div>进货金额<b>${money(r.supplyAmount)}</b></div><div>销售金额<b>${money(r.saleAmount)}</b></div></div><div class="profit-line ${p!==null&&p<0?'loss':''}"><span>本单利润</span><b class="${p===null?'unknown':''}">${p===null?'待补金额':yuan(p)}</b></div><div class="steps">${ks.map(([k,t])=>{let d=r[k+'Date'];return `<div class="step ${r[k]?'ok':''}"><div class="dot"></div>${t}<span class="step-date ${r[k]&&!d?'missing':''}">${r[k]?(d?esc(d.slice(5).replace('-','/')):'待补日期'):''}</span></div>`}).join('')}</div></article>`}
function applySearch(e){e.preventDefault();searchText=$('#searchText').value.trim();renderHome()}
function setSearchDate(v){searchDate=v;renderHome()}
function clearSearch(){searchText='';searchDate='';renderHome()}
function setFilter(f){filter=f;renderHome()}
function openForm(id=null){page='form';editId=id;render();scrollTo(0,0)}
function renderForm(){let r=db.records.find(x=>x.id===editId)||{date:localDate(),businessContent:'',client:'',supplier:'',supplyAmount:'',saleAmount:'',taxAmount:'',otherExpense:'',supplySettled:false,saleSettled:false,invoiced:false,paid:false,reimbursed:false};$('#app').innerHTML=`<header class="page-head"><button class="back" onclick="go('home')">‹</button><h2>${editId?'编辑账目':'新建账目'}</h2></header><form class="form" onsubmit="submitRecord(event)"><p class="hint">只需先选择日期和客户即可保存，其余内容可以随业务进展逐步补充。</p><section class="group"><div class="field"><label>需求日期 · 必填</label><input id="date" type="date" value="${esc(r.date)}" required></div><div class="field"><label>业务内容</label><input id="businessContent" type="text" maxlength="100" value="${esc(r.businessContent)}"></div><div class="field"><label>客户名称 · 必填</label><select id="client" required><option value="">请选择客户</option>${db.clients.map(x=>`<option ${x===r.client?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>供货单位 · 可稍后填写</label><select id="supplier"><option value=""></option>${db.suppliers.map(x=>`<option ${x===r.supplier?'selected':''}>${esc(x)}</option>`).join('')}</select></div></section>${!db.clients.length?`<p class="hint">请先到“客户”页面添加客户。</p>`:''}<section class="group"><div class="field"><label>进货金额</label><div class="amount-wrap"><span>¥</span><input id="supplyAmount" inputmode="decimal" pattern="[0-9]*([.][0-9]{0,2})?" value="${esc(r.supplyAmount)}"></div></div><div class="field"><label>销售金额（向客户开票）</label><div class="amount-wrap"><span>¥</span><input id="saleAmount" inputmode="decimal" pattern="[0-9]*([.][0-9]{0,2})?" value="${esc(r.saleAmount)}"></div></div><div class="field"><label>税费</label><div class="amount-wrap"><span>¥</span><input id="taxAmount" inputmode="decimal" pattern="[0-9]*([.][0-9]{0,2})?" value="${esc(r.taxAmount||'')}"></div></div><div class="field"><label>其他支出</label><div class="amount-wrap"><span>¥</span><input id="otherExpense" inputmode="decimal" pattern="[0-9]*([.][0-9]{0,2})?" value="${esc(r.otherExpense||'')}"></div></div><div class="field"><label>本单利润</label><div id="profitPreview" style="font-size:20px;font-weight:700;color:var(--green)">待补金额</div><div class="hint" style="padding:4px 0 0">销售金额 − 进货金额 − 税费 − 其他支出</div></div></section><section class="group">${toggle('supplySettled','供货结算','是否已与供货单位结算',r.supplySettled,r.supplySettledDate)}${toggle('saleSettled','销售结算','是否已完成销售结算',r.saleSettled,r.saleSettledDate)}${toggle('invoiced','开票','公司是否已向客户开票',r.invoiced,r.invoicedDate)}${toggle('paid','客户回款','客户是否已向公司付款',r.paid,r.paidDate)}${toggle('reimbursed','结算','公司是否已返还垫付款',r.reimbursed,r.reimbursedDate)}</section>${editId?`<button type="button" class="delete" onclick="removeRecord()">删除这笔账目</button>`:''}</form><button class="save" onclick="document.querySelector('form').requestSubmit()">保存账目</button>`;['supplyAmount','saleAmount','taxAmount','otherExpense'].forEach(k=>document.getElementById(k).addEventListener('input',updateProfitPreview));updateProfitPreview()}
function updateProfitPreview(){let v=id=>document.getElementById(id).value.trim(),p=profitCents({supplyAmount:v('supplyAmount'),saleAmount:v('saleAmount'),taxAmount:v('taxAmount'),otherExpense:v('otherExpense')}),e=$('#profitPreview');e.textContent=p===null?'待补金额':yuan(p);e.style.color=p===null?'var(--orange)':p<0?'#bd5938':'var(--green)'}
function toggle(k,title,sub,val,date){return `<div class="status-item"><div class="yn-row"><div class="yn-title"><b>${title}</b><small>${sub}</small></div><div class="toggle" data-key="${k}" data-value="${!!val}"><button type="button" class="no ${!val?'on':''}" onclick="pick(this,false)">否</button><button type="button" class="yes ${val?'on':''}" onclick="pick(this,true)">是</button></div></div><div id="${k}DateWrap" class="completion-date ${val?'show':''}"><label for="${k}Date">${title}日期</label><input id="${k}Date" type="date" value="${esc(date||'')}" ${val?'required':''}></div></div>`}
function pick(btn,v){let p=btn.parentElement,key=p.dataset.key,input=document.getElementById(key+'Date'),wrap=document.getElementById(key+'DateWrap');p.dataset.value=v;p.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');if(v&&!input.value)input.value=localDate();if(!v)input.value='';input.required=v;wrap.classList.toggle('show',v)}
function submitRecord(e){e.preventDefault();let val=id=>document.getElementById(id).value.trim();let r={id:editId||Date.now().toString(),date:val('date'),businessContent:val('businessContent'),client:val('client'),supplier:val('supplier'),supplyAmount:val('supplyAmount'),saleAmount:val('saleAmount'),taxAmount:val('taxAmount'),otherExpense:val('otherExpense')};document.querySelectorAll('.toggle').forEach(t=>{let k=t.dataset.key;r[k]=t.dataset.value==='true';r[k+'Date']=r[k]?val(k+'Date'):''});if(editId)db.records=db.records.map(x=>x.id===editId?r:x);else db.records.push(r);saveDB();toast('账目已保存');go('home')}
function removeRecord(){if(!editId||!db.records.some(x=>x.id===editId))return;deleteTargetId=editId;$('#deletePhrase').value='';updateDeleteButton();$('#deleteDialog').hidden=false;$('#deletePhrase').focus()}
function updateDeleteButton(){$('#deleteConfirmButton').disabled=$('#deletePhrase').value!=='确认'}
function closeDeleteDialog(){$('#deleteDialog').hidden=true;$('#deletePhrase').value='';deleteTargetId=null;updateDeleteButton()}
function deleteConfirmed(e){e.preventDefault();if($('#deletePhrase').value!=='确认'||!deleteTargetId||deleteTargetId!==editId)return;db.records=db.records.filter(x=>x.id!==deleteTargetId);saveDB();closeDeleteDialog();toast('账目已删除');go('home')}
function renderEntities(type){let isC=type==='clients', arr=db[type], title=isC?'客户':'供货商';$('#app').innerHTML=`<header class="page-head"><div><h2>${title}管理</h2><div class="meta">共 ${arr.length} 个${title}</div></div></header><div class="entity-add"><input id="entityInput" placeholder="输入${title}名称" maxlength="40"><button onclick="addEntity('${type}')">＋</button></div><section class="entity-list">${arr.length?arr.map((x,i)=>`<div class="entity"><div class="entity-icon">${isC?'客':'供'}</div><span>${esc(x)}</span><button onclick="removeEntity('${type}',${i})">×</button></div>`).join(''):`<div class="empty"><div class="empty-mark">＋</div><h3>添加第一个${title}</h3><p>添加后，新建账目时可以直接选择</p></div>`}</section>${nav(type)}</main>`;setTimeout(()=>{$('#entityInput').onkeydown=e=>{if(e.key==='Enter')addEntity(type)}},0)}
function addEntity(type){let i=$('#entityInput'),v=i.value.trim();if(!v)return toast('请输入名称');if(db[type].includes(v))return toast('这个名称已经存在');db[type].push(v);saveDB();renderEntities(type);toast('已添加')}
function removeEntity(type,i){let name=db[type][i],used=db.records.some(r=>(type==='clients'?r.client:r.supplier)===name);if(used)return toast('已有账目使用，不能删除');if(confirm(`确定删除“${name}”吗？`)){db[type].splice(i,1);saveDB();renderEntities(type)}}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function render(){if(page==='home')renderHome();else if(page==='form')renderForm();else renderEntities(page)}
window.appBack=()=>{if(!$('#deleteDialog').hidden){closeDeleteDialog();return true}if(page!=='home'){go('home');return true}return false};render();
</script></body></html>
